
name: Refresh winery events

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-events.yml'
  schedule:
    - cron: '0 14 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - continue-on-error: true
        run: python scripts/update_events.py
      - continue-on-error: true
        run: python scripts/update_local_events.py
      - name: Collect Explore Elk Grove events
        continue-on-error: true
        run: python scripts/update_explore_elkgrove.py
      - name: Collect Oak Farm events
        continue-on-error: true
        run: python scripts/update_oak_farm.py
      - name: Collect Visit Lodi wine events
        continue-on-error: true
        run: python scripts/update_visit_lodi.py
      - name: Commit updated event data
        run: |
          git config user.name 'sendero-events-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.json data/local_events.json
          if [ -f data/explore_events.json ]; then git add data/explore_events.json; fi
          if [ -f data/oak_farm_events.json ]; then git add data/oak_farm_events.json; fi
          if [ -f data/visit_lodi_events.json ]; then git add data/visit_lodi_events.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update official winery events'
            git push
          fi
