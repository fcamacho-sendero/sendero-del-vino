name: Probe Delta winery event sources
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/probe_delta_sources.py'
      - '.github/workflows/probe-delta-sources.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python -m py_compile scripts/probe_delta_sources.py
      - run: python scripts/probe_delta_sources.py | tee delta-source-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: delta-source-audit
          path: delta-source-audit.json
